<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Light</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
<style>
  :root { --bg:#eef3f8; --panel:#fff; --line:#d9e1ea; --text:#1d2733; --muted:#6b7a8c; --blue:#0094ce; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); }
  .bar { background:var(--blue); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .bar h1 { font-size:1.2rem; margin:0; font-weight:600; }
  .conn { font-size:.85rem; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ff8a8a; }
  .dot.on { background:#9bf2b8; }
  main { max-width:980px; margin:0 auto; padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .panel h2 { margin:0 0 12px; font-size:1.05rem; color:var(--blue); }
  .wide { grid-column:1/-1; }
  .row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border:0; }
  .big { text-align:center; font-size:2.4rem; font-weight:700; }
  .cap { text-align:center; color:var(--muted); font-size:.85rem; }
  .small { color:var(--muted); font-size:.8rem; margin-top:10px; }
  svg { width:100%; height:auto; display:block; border-radius:10px; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .pill { padding:4px 12px; border-radius:12px; font-size:.8rem; font-weight:700; color:#fff; background:#888; }
  @keyframes flick { 0%,100% { opacity:1 } 50% { opacity:.2 } }
  @keyframes twinkle { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  .flick { animation:flick .6s infinite; }
  .star { animation:twinkle 2.5s infinite; }
  @media (prefers-reduced-motion:reduce) { .flick,.star { animation:none; } }
  canvas { width:100%; height:170px; display:block; }
  .btns { display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
  button { background:var(--blue); color:#fff; border:0; border-radius:4px; padding:12px; font-size:.85rem; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.1); } button:focus-visible { outline:3px solid #004f6e; outline-offset:2px; }
</style>
</head>
<body>
<div class="bar">
  <h1>Street Light</h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="conn">Menghubungkan...</span></div>
</div>

<main>
  <section class="panel wide">
    <h2>Status lampu</h2>
    <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi lampu jalan">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="skyTop" offset="0" stop-color="#4aa3df"/><stop id="skyBot" offset="1" stop-color="#bfe6ff"/></linearGradient>
        <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe082" stop-opacity="0.75"/><stop offset="1" stop-color="#ffe082" stop-opacity="0.05"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff3b0" stop-opacity="0.9"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="400" height="220" fill="url(#sky)"/>
      <g id="stars" opacity="0" fill="#fff">
        <circle class="star" cx="40" cy="30" r="1.5"/><circle class="star" cx="90" cy="55" r="1.2"/><circle class="star" cx="150" cy="25" r="1.6"/>
        <circle class="star" cx="230" cy="40" r="1.2"/><circle class="star" cx="300" cy="22" r="1.5"/><circle class="star" cx="360" cy="60" r="1.3"/>
      </g>
      <g id="sun"><circle cx="340" cy="45" r="30" fill="#fff59d" opacity="0.35"/><circle cx="340" cy="45" r="18" fill="#ffd54f"/></g>
      <g id="moon" opacity="0"><circle cx="60" cy="50" r="16" fill="#eceff1"/><circle id="moonCut" cx="68" cy="45" r="14" fill="#0b1026"/></g>
      <g fill="#37474f"><rect x="20" y="105" width="55" height="65"/><rect x="80" y="125" width="40" height="45"/><rect x="300" y="100" width="60" height="70"/><rect x="365" y="130" width="35" height="40"/></g>
      <g id="windows" opacity="0" fill="#ffe082">
        <rect x="30" y="118" width="9" height="9"/><rect x="50" y="118" width="9" height="9"/><rect x="30" y="138" width="9" height="9"/><rect x="50" y="148" width="9" height="9"/>
        <rect x="90" y="138" width="9" height="9"/><rect x="104" y="150" width="9" height="9"/><rect x="312" y="114" width="9" height="9"/><rect x="332" y="114" width="9" height="9"/>
        <rect x="312" y="136" width="9" height="9"/><rect x="340" y="146" width="9" height="9"/>
      </g>
      <rect y="170" width="400" height="50" fill="#2b2f36"/><rect y="170" width="400" height="6" fill="#555b66"/>
      <g fill="#e0e0e0" opacity="0.7"><rect x="20" y="198" width="40" height="4"/><rect x="100" y="198" width="40" height="4"/><rect x="180" y="198" width="40" height="4"/><rect x="260" y="198" width="40" height="4"/><rect x="340" y="198" width="40" height="4"/></g>
      <g id="light" opacity="0">
        <polygon points="252,70 195,172 315,172" fill="url(#cone)"/>
        <ellipse cx="255" cy="173" rx="60" ry="6" fill="#ffe082" opacity="0.5"/>
        <circle cx="252" cy="66" r="38" fill="url(#glow)"/>
      </g>
      <rect x="196" y="72" width="8" height="100" fill="#4a4f57"/><rect x="190" y="166" width="20" height="6" fill="#3a3e45"/>
      <path d="M200 74 Q200 58 225 58 L248 58" stroke="#4a4f57" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M240 58 L264 58 L260 68 L244 68 Z" fill="#3a3e45"/>
      <ellipse id="bulb" cx="252" cy="68" rx="8" ry="3.5" fill="#777"/>
      <g id="faultIcon" class="flick" style="display:none"><polygon points="252,12 270,42 234,42" fill="#e53935"/><text x="252" y="38" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">!</text></g>
      <text id="luxTxt" x="10" y="16" font-size="11" fill="#fff" opacity="0.85">- lux</text>
      <g id="offline"><rect width="400" height="220" fill="#37474f" opacity="0.85"/><text x="200" y="115" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">OFFLINE</text><text x="200" y="136" font-size="11" fill="#cfd8dc" text-anchor="middle">menunggu data ESP32...</text></g>
    </svg>
    <div class="pills"><span class="pill" id="pLamp">-</span><span class="pill" id="pMode">-</span><span class="pill" id="pStat">-</span></div>
  </section>

  <section class="panel">
    <h2>Sensor</h2>
    <div class="cap">Intensitas cahaya</div>
    <div class="big"><span id="lux">-</span> <span style="font-size:1rem;color:var(--muted)">lux</span></div>
    <div class="row" style="margin-top:12px"><span>Nilai ADC LDR</span><b id="raw">-</b></div>
    <div class="small" id="last">Belum ada data. Jalankan simulasi Wokwi.</div>
  </section>

  <section class="panel">
    <h2>Lux (10 menit terakhir)</h2>
    <canvas id="chart" width="600" height="170"></canvas>
  </section>

  <section class="panel wide" id="ctl">
    <h2>Kontrol</h2>
    <div class="btns">
      <button data-cmd="on">LAMPU ON</button><button data-cmd="off">LAMPU OFF</button><button data-cmd="auto">MODE AUTO</button>
      <button data-cmd="fault">SIMULASI LAMPU RUSAK</button><button data-cmd="fix">PERBAIKI LAMPU</button>
    </div>
    <div class="small">Tombol mengirim perintah ke Wokwi lewat MQTT. Siapa pun yang punya link ini bisa menekannya.</div>
  </section>
</main>

<script>
/* ===== PENGATURAN ===== */
const BROKER_HOST = "broker.hivemq.com";
const BROKER_PORT = 8884;
const BROKER_PATH = "/mqtt";

const DATA_TOPIC = "kampus/iot/streetlight/telemetry";
const CMD_TOPIC  = "GANTI/topic/command";   // isi dari node "command" di Node-RED
const CMD = { on: "ON", off: "OFF", auto: "AUTO", fault: "FAULT_ON", fix: "FAULT_OFF" };
const DARK_LUX = 600;      // makin kecil lux dari angka ini, langit makin gelap
const OFFLINE_MS = 15000;  // dianggap offline jika tidak ada data selama 15 detik
/* ====================== */

const $ = id => document.getElementById(id);
const hist = [], WINDOW = 10 * 60 * 1000;
let lastSeen = 0;

const hex = c => [1,3,5].map(i => parseInt(c.substr(i,2),16));
const mix = (a,b,t) => { const x=hex(a), y=hex(b); return "rgb(" + x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(",") + ")"; };
const clamp = n => Math.max(0, Math.min(1, n));
const pill = (el, text, color) => { el.textContent = text; el.style.background = color; };

function update(d) {
  const lux = Number(d.lux) || 0;
  const night = clamp(1 - lux / DARK_LUX);
  const status = String(d.status || "normal");
  const fault = status.toLowerCase() !== "normal";
  const on = String(d.lamp).toUpperCase() === "ON";
  const top = mix("#4aa3df", "#0b1026", night);

  $("skyTop").setAttribute("stop-color", top);
  $("skyBot").setAttribute("stop-color", mix("#bfe6ff", "#1c2a55", night));
  $("moonCut").setAttribute("fill", top);
  $("stars").setAttribute("opacity", night);
  $("moon").setAttribute("opacity", night);
  $("sun").setAttribute("opacity", 1 - night);
  $("windows").setAttribute("opacity", night * 0.85);
  $("light").setAttribute("opacity", (on && !fault) ? 1 : 0);
  $("bulb").setAttribute("fill", fault ? "#e53935" : (on ? "#ffd54f" : "#777"));
  $("bulb").classList.toggle("flick", fault);
  $("faultIcon").style.display = fault ? "" : "none";
  $("luxTxt").textContent = lux.toFixed(1) + " lux";
  $("offline").style.display = "none";

  pill($("pLamp"), "Lampu " + (d.lamp ?? "-"), on ? "#f9a825" : "#757575");
  pill($("pMode"), "Mode " + (d.mode ?? "-"), String(d.mode).toUpperCase() === "AUTO" ? "#43a047" : "#1e88e5");
  pill($("pStat"), status, fault ? "#e53935" : "#43a047");
  $("lux").textContent = lux.toFixed(1);
  $("raw").textContent = d.ldr_raw ?? "-";
  $("last").textContent = "Data terakhir: " + new Date().toLocaleTimeString("id-ID") + (d.device ? "  (" + d.device + ")" : "");

  lastSeen = Date.now();
  hist.push({ t: lastSeen, lux });
  while (hist.length && lastSeen - hist[0].t > WINDOW) hist.shift();
  draw();
}

function draw() {
  const c = $("chart"), g = c.getContext("2d"), W = c.width, H = c.height, L = 44, B = 22, T = 8, R = 10;
  g.clearRect(0, 0, W, H);
  g.font = "12px Segoe UI"; g.fillStyle = "#6b7a8c"; g.strokeStyle = "#e3e9f0"; g.lineWidth = 1;
  const max = Math.max(1000, ...hist.map(p => p.lux));
  for (let i = 0; i <= 4; i++) {
    const y = T + (H - T - B) * (1 - i / 4);
    g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke();
    g.fillText(Math.round(max * i / 4), 4, y + 4);
  }
  if (hist.length < 2) return;
  const t0 = Date.now() - WINDOW;
  g.strokeStyle = "#0094ce"; g.lineWidth = 2; g.beginPath();
  hist.forEach((p, i) => {
    const x = L + (p.t - t0) / WINDOW * (W - L - R), y = T + (H - T - B) * (1 - p.lux / max);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

setInterval(() => { if (lastSeen && Date.now() - lastSeen > OFFLINE_MS) $("offline").style.display = ""; }, 2000);

const client = new Paho.MQTT.Client(BROKER_HOST, BROKER_PORT, BROKER_PATH, "web-" + Math.random().toString(16).slice(2, 10));
client.onMessageArrived = m => {
  if (m.destinationName !== DATA_TOPIC) return;
  try { update(JSON.parse(m.payloadString)); } catch (e) { $("last").textContent = "Format data bukan JSON: " + m.payloadString; }
};
const setConn = (ok, t) => { $("dot").classList.toggle("on", ok); $("conn").textContent = t; };
client.onConnectionLost = () => { setConn(false, "Terputus, mencoba lagi..."); setTimeout(connect, 3000); };
function connect() {
  client.connect({
    useSSL: true, timeout: 8,
    onSuccess: () => { setConn(true, "Terhubung ke " + BROKER_HOST); client.subscribe(DATA_TOPIC); },
    onFailure: () => { setConn(false, "Gagal terhubung"); setTimeout(connect, 5000); }
  });
}

if (CMD_TOPIC.includes("GANTI")) $("ctl").style.display = "none";   // tombol disembunyikan sampai topic diisi
document.querySelectorAll("button[data-cmd]").forEach(b => b.addEventListener("click", () => {
  if (!client.isConnected()) { alert("Belum terhubung ke MQTT."); return; }
  const m = new Paho.MQTT.Message(CMD[b.dataset.cmd]);
  m.destinationName = CMD_TOPIC;
  client.send(m);
}));

draw();
connect();
</script>
</body>
</html>
